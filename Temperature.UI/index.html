<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Temperature Chart</title>
    </head>

    <body>
        <label>Start: <input type="datetime-local" id="start-input"></label>
        <label>End: <input type="datetime-local" id="end-input"></label>
        <button onclick="updateGraph()">Update</button>

        <canvas id="tempChart" style="max-width: 800px; margin-top: 20px;"></canvas>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.1.0/dist/chartjs-adapter-luxon.min.js"></script>

        <script>
            let chart = null;

            function pad(n) { 
                return n.toString().padStart(2, '0'); 
            }

            function setDefaultTimes() {
                const now = new Date();
                const fifteenMinEarlier = new Date(now.getTime() - 15 * 60 * 1000);

                const formatDate = date => 
                    `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;

                document.getElementById("end-input").value = formatDate(now);
                document.getElementById("start-input").value = formatDate(fifteenMinEarlier);
            }

            setDefaultTimes();

            async function updateGraph() {
                const start = document.getElementById("start-input").value;
                const end = document.getElementById("end-input").value;

                const params = new URLSearchParams();
                if (start) params.append('intervalStart', start);
                if (end) params.append('intervalEnd', end);

                try {
                    const response = await fetch(`http://localhost:5255/api/Temperature?${params.toString()}`);
                    if (!response.ok) throw new Error('Failed to fetch data');
                    const data = await response.json();

                    const labels = data.map(d => d.timestamp.replace(' ', 'T'));
                    const temps  = data.map(d => d.temperature);

                    if (chart) chart.destroy();

                    const ctx = document.getElementById('tempChart').getContext('2d');
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Temperature (°C)',
                                data: temps,
                                borderColor: 'blue',
                                backgroundColor: 'rgba(0, 0, 255, 0.1)',
                                fill: true,
                                pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                x: {
                                    type: 'time',
                                    time: {
                                        unit: 'minute',
                                        displayFormats: { minute: 'HH:mm' }
                                    },
                                    title: { display: true, text: 'Time' }
                                },
                                y: {
                                    beginAtZero: false,
                                    title: { display: true, text: 'Temperature (°C)' }
                                }
                            }
                        }
                    });

                } catch (error) {
                    console.error('Error fetching temperature data:', error);
                }
            }

            updateGraph();
        </script>
    </body>
</html>
